# RouteCraft live FRRouting lab.
#
#   edge (AS 65001)
#     | eBGP
#   core-a ---- 10 ---- core-b        AS 65000: OSPF area 0 + iBGP full mesh
#      \                  | 10
#       \------ 30 ------ dc
#
# Every link is a /31 point-to-point Docker network (RFC 3021) with no host
# gateway, so the host is never part of the lab's routing domain. Interface
# names are fixed per link (to-<peer>) instead of depending on Docker's ethN
# ordering. interface_name needs Docker Engine 28.1+ and Compose 2.36+.

name: routecraft-lab

x-frr-node: &frr-node
  image: quay.io/frrouting/frr:10.7.1
  # FRR daemons call cap_set_proc() for these at startup and exit without them
  # (SYS_ADMIN included); this is still far narrower than --privileged.
  cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE, SYS_ADMIN]
  sysctls:
    net.ipv4.ip_forward: 1
    net.ipv4.conf.all.rp_filter: 0
    net.ipv4.conf.default.rp_filter: 0
  healthcheck:
    test: ["CMD", "vtysh", "-c", "show bgp summary"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 5s

services:
  edge:
    <<: *frr-node
    hostname: edge
    volumes:
      - ./lab/frr/daemons:/etc/frr/daemons:ro
      - ./lab/frr/vtysh.conf:/etc/frr/vtysh.conf:ro
      - ./lab/frr/edge/frr.conf:/etc/frr/frr.conf:ro
    networks:
      edge_core_a: {ipv4_address: 172.30.0.0, interface_name: to-core-a}

  core-a:
    <<: *frr-node
    hostname: core-a
    volumes:
      - ./lab/frr/daemons:/etc/frr/daemons:ro
      - ./lab/frr/vtysh.conf:/etc/frr/vtysh.conf:ro
      - ./lab/frr/core-a/frr.conf:/etc/frr/frr.conf:ro
    networks:
      edge_core_a: {ipv4_address: 172.30.0.1, interface_name: to-edge}
      core_a_core_b: {ipv4_address: 172.30.0.2, interface_name: to-core-b}
      core_a_dc: {ipv4_address: 172.30.0.6, interface_name: to-dc}

  core-b:
    <<: *frr-node
    hostname: core-b
    volumes:
      - ./lab/frr/daemons:/etc/frr/daemons:ro
      - ./lab/frr/vtysh.conf:/etc/frr/vtysh.conf:ro
      - ./lab/frr/core-b/frr.conf:/etc/frr/frr.conf:ro
    networks:
      core_a_core_b: {ipv4_address: 172.30.0.3, interface_name: to-core-a}
      core_b_dc: {ipv4_address: 172.30.0.4, interface_name: to-dc}

  dc:
    <<: *frr-node
    hostname: dc
    volumes:
      - ./lab/frr/daemons:/etc/frr/daemons:ro
      - ./lab/frr/vtysh.conf:/etc/frr/vtysh.conf:ro
      - ./lab/frr/dc/frr.conf:/etc/frr/frr.conf:ro
    networks:
      core_b_dc: {ipv4_address: 172.30.0.5, interface_name: to-core-b}
      core_a_dc: {ipv4_address: 172.30.0.7, interface_name: to-core-a}

x-p2p-link: &p2p-link
  internal: true
  driver_opts:
    com.docker.network.bridge.gateway_mode_ipv4: isolated

networks:
  edge_core_a:
    <<: *p2p-link
    ipam: {config: [{subnet: 172.30.0.0/31}]}
  core_a_core_b:
    <<: *p2p-link
    ipam: {config: [{subnet: 172.30.0.2/31}]}
  core_b_dc:
    <<: *p2p-link
    ipam: {config: [{subnet: 172.30.0.4/31}]}
  core_a_dc:
    <<: *p2p-link
    ipam: {config: [{subnet: 172.30.0.6/31}]}
