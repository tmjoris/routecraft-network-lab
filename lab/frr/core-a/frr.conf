hostname core-a
log stdout
!
interface eth0
 ip address 172.30.1.2/30
interface eth1
 ip address 172.30.2.1/30
interface eth2
 ip address 172.30.4.1/30
!
router ospf
 ospf router-id 10.255.0.2
 network 172.30.2.0/30 area 0
 network 172.30.4.0/30 area 0
!
router bgp 65000
 bgp router-id 10.255.0.2
 neighbor 172.30.1.1 remote-as 65001
 address-family ipv4 unicast
  redistribute ospf
 exit-address-family
!
line vty
