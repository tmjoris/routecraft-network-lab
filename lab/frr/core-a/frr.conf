! core-a: AS 65000 border router. eBGP to edge, OSPF + iBGP inside the AS.
frr defaults traditional
hostname core-a
log stdout informational
service integrated-vtysh-config
!
key chain OSPF-AUTH
 key 1
  key-string routecraft-lab-ospf
  cryptographic-algorithm hmac-sha-256
 exit
exit
!
interface lo
 ip address 10.255.0.2/32
exit
!
interface to-edge
 description eBGP to edge AS 65001
 ip address 172.30.0.1/31
exit
!
interface to-core-b
 description OSPF to core-b
 ip address 172.30.0.2/31
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf bfd
 ip ospf authentication key-chain OSPF-AUTH
exit
!
interface to-dc
 description OSPF to dc (backup path)
 ip address 172.30.0.6/31
 ip ospf network point-to-point
 ip ospf cost 30
 ip ospf bfd
 ip ospf authentication key-chain OSPF-AUTH
exit
!
router ospf
 ospf router-id 10.255.0.2
 log-adjacency-changes detail
 passive-interface lo
 network 10.255.0.2/32 area 0
 network 172.30.0.2/31 area 0
 network 172.30.0.6/31 area 0
exit
!
ip prefix-list EDGE-IN seq 10 permit 192.0.2.0/24
ip prefix-list EDGE-OUT seq 10 permit 10.10.0.0/16
!
route-map EDGE-IN permit 10
 match ip address prefix-list EDGE-IN
exit
route-map EDGE-IN deny 100
exit
!
route-map EDGE-OUT permit 10
 match ip address prefix-list EDGE-OUT
exit
route-map EDGE-OUT deny 100
exit
!
router bgp 65000
 bgp router-id 10.255.0.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor IBGP peer-group
 neighbor IBGP remote-as internal
 neighbor IBGP update-source lo
 neighbor 10.255.0.3 peer-group IBGP
 neighbor 10.255.0.3 description core-b
 neighbor 10.255.0.4 peer-group IBGP
 neighbor 10.255.0.4 description dc
 neighbor 172.30.0.0 remote-as 65001
 neighbor 172.30.0.0 description edge
 neighbor 172.30.0.0 password routecraft-lab-bgp
 neighbor 172.30.0.0 bfd
 !
 address-family ipv4 unicast
  neighbor IBGP activate
  neighbor IBGP next-hop-self
  neighbor 172.30.0.0 activate
  neighbor 172.30.0.0 route-map EDGE-IN in
  neighbor 172.30.0.0 route-map EDGE-OUT out
  neighbor 172.30.0.0 maximum-prefix 100
 exit-address-family
exit
!
line vty
!
