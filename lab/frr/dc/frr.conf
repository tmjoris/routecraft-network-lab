! dc: AS 65000 data-centre router. Originates the 10.10.0.0/16 service prefix.
frr defaults traditional
hostname dc
log stdout informational
service integrated-vtysh-config
!
key chain OSPF-AUTH
 key 1
  key-string routecraft-lab-ospf
  cryptographic-algorithm hmac-sha-256
 exit
exit
!
interface lo
 ip address 10.255.0.4/32
 ip address 10.10.0.1/32
exit
!
interface to-core-b
 description OSPF to core-b
 ip address 172.30.0.5/31
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf bfd
 ip ospf authentication key-chain OSPF-AUTH
exit
!
interface to-core-a
 description OSPF to core-a (backup path)
 ip address 172.30.0.7/31
 ip ospf network point-to-point
 ip ospf cost 30
 ip ospf bfd
 ip ospf authentication key-chain OSPF-AUTH
exit
!
! Anchor route so the aggregate is always in the RIB and can be originated.
ip route 10.10.0.0/16 blackhole
!
router ospf
 ospf router-id 10.255.0.4
 log-adjacency-changes detail
 passive-interface lo
 network 10.255.0.4/32 area 0
 network 172.30.0.4/31 area 0
 network 172.30.0.6/31 area 0
exit
!
router bgp 65000
 bgp router-id 10.255.0.4
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor IBGP peer-group
 neighbor IBGP remote-as internal
 neighbor IBGP update-source lo
 neighbor 10.255.0.2 peer-group IBGP
 neighbor 10.255.0.2 description core-a
 neighbor 10.255.0.3 peer-group IBGP
 neighbor 10.255.0.3 description core-b
 !
 address-family ipv4 unicast
  network 10.10.0.0/16
  neighbor IBGP activate
 exit-address-family
exit
!
line vty
!
