! edge: external network AS 65001. Single-homed eBGP to core-a.
frr defaults traditional
hostname edge
log stdout informational
service integrated-vtysh-config
!
interface lo
 ip address 10.255.1.1/32
 ip address 192.0.2.1/32
exit
!
interface to-core-a
 description eBGP to core-a AS 65000
 ip address 172.30.0.0/31
exit
!
! Anchor route so the aggregate is always in the RIB and can be originated.
ip route 192.0.2.0/24 blackhole
!
ip prefix-list CORE-IN seq 10 permit 10.10.0.0/16
ip prefix-list CORE-OUT seq 10 permit 192.0.2.0/24
!
route-map CORE-IN permit 10
 match ip address prefix-list CORE-IN
exit
route-map CORE-IN deny 100
exit
!
route-map CORE-OUT permit 10
 match ip address prefix-list CORE-OUT
exit
route-map CORE-OUT deny 100
exit
!
router bgp 65001
 bgp router-id 10.255.1.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 172.30.0.1 remote-as 65000
 neighbor 172.30.0.1 description core-a
 neighbor 172.30.0.1 password routecraft-lab-bgp
 neighbor 172.30.0.1 bfd
 !
 address-family ipv4 unicast
  network 192.0.2.0/24
  neighbor 172.30.0.1 activate
  neighbor 172.30.0.1 route-map CORE-IN in
  neighbor 172.30.0.1 route-map CORE-OUT out
  neighbor 172.30.0.1 maximum-prefix 100
 exit-address-family
exit
!
line vty
!
