[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routecraft"
version = "0.2.0"
description = "Routing topology validation, failure analysis and a live FRRouting lab"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/tmjoris/routecraft-network-lab"

[project.scripts]
routecraft = "routecraft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
routecraft = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not lab"]
markers = ["lab: needs the live FRRouting lab (docker compose up); run with -m lab"]

[tool.coverage.run]
source = ["routecraft"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL"]
ignore = ["PLR2004", "PLR0913"]

[tool.ruff.lint.isort]
known-local-folder = ["labkit"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = ["src", "tests/lab"]
explicit_package_bases = true
