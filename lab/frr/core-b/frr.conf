! core-b: AS 65000 transit router. OSPF + iBGP only.
frr defaults traditional
hostname core-b
log stdout informational
service integrated-vtysh-config
!
key chain OSPF-AUTH
 key 1
  key-string routecraft-lab-ospf
  cryptographic-algorithm hmac-sha-256
 exit
exit
!
interface lo
 ip address 10.255.0.3/32
exit
!
interface to-core-a
 description OSPF to core-a
 ip address 172.30.0.3/31
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf bfd
 ip ospf authentication key-chain OSPF-AUTH
exit
!
interface to-dc
 description OSPF to dc
 ip address 172.30.0.4/31
 ip ospf network point-to-point
 ip ospf cost 10
 ip ospf bfd
 ip ospf authentication key-chain OSPF-AUTH
exit
!
router ospf
 ospf router-id 10.255.0.3
 log-adjacency-changes detail
 passive-interface lo
 network 10.255.0.3/32 area 0
 network 172.30.0.2/31 area 0
 network 172.30.0.4/31 area 0
exit
!
router bgp 65000
 bgp router-id 10.255.0.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor IBGP peer-group
 neighbor IBGP remote-as internal
 neighbor IBGP update-source lo
 neighbor 10.255.0.2 peer-group IBGP
 neighbor 10.255.0.2 description core-a
 neighbor 10.255.0.4 peer-group IBGP
 neighbor 10.255.0.4 description dc
 !
 address-family ipv4 unicast
  neighbor IBGP activate
 exit-address-family
exit
!
line vty
!
